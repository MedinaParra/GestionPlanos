name: Apply v13 approval flow

on:
  push:
    branches:
      - agent/document-management-v2
    paths:
      - .github/workflows/apply-v13-approval-flow.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    name: Apply flow, test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/document-management-v2
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Apply approval-flow corrections
        run: |
          python3 scripts/apply_v13_approval_flow.py
          python3 scripts/fix_v13_signature_screen.py

      - name: Restore stable debug keystore
        run: base64 --decode .github/ci-debug-keystore.b64 > app/ci-debug.keystore

      - name: Verify stable certificate fingerprints
        run: keytool -list -v -keystore app/ci-debug.keystore -storepass GestionPlanos2026 -alias gestionplanos

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Record APK checksum
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          stat --printf='APK_SIZE=%s\n' app/build/outputs/apk/debug/app-debug.apk | tee apk-size.txt

      - name: Commit corrected flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/example/MainActivity.kt \
            app/src/main/java/com/example/document/pdf/PdfStampService.kt \
            app/src/main/java/com/example/document/ui/ApprovalSignaturePlacementScreen.kt \
            app/src/main/java/com/example/document/ui/CorporatePdfViewerV7.kt \
            app/src/main/java/com/example/document/ui/DocumentViewModel.kt \
            app/src/main/java/com/example/document/ui/WorkflowDocumentApp.kt \
            app/src/main/java/com/example/document/ui/WorkflowViewModel.kt
          git diff --cached --quiet || git commit -m "Corregir secuencia de aprobación y firma v13"
          git push origin HEAD:agent/document-management-v2

      - name: Upload v13 APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-planos-v13-aprobacion-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-size.txt
          if-no-files-found: error
