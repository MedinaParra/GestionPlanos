name: Validate Drive document management app

on:
  push:
    branches:
      - agent/document-management-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Restore stable debug keystore
        run: base64 --decode .github/ci-debug-keystore.b64 > app/ci-debug.keystore
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify signing certificate
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-planos-workflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
